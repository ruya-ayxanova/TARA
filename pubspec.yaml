name: tara
description: Tara - hızlı, reklam engelleyici ve medya indirme destekli tarayıcı.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.0.0
  dio: ^5.4.0
  path_provider: ^2.1.0
  shared_preferences: ^2.3.0
  share_plus: ^10.1.4
  open_filex: ^4.6.0
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5

dev_dependencies:
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: tara-icon.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
